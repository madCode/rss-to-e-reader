<script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "WebSite", "@id": "https://metro-weekly.example/#website", "name": "Metro Weekly"}, {"@type": "NewsArticle", "headline": "The Night Shift That Keeps the Trams Running", "datePublished": "2026-09-14T06:00:00+01:00", "author": {"@type": "Person", "name": "Kofi Mensah"}, "isAccessibleForFree": false, "articleBody": "Every night, somewhere between two and four in the morning, a small crew of people walks the length of the city's oldest tram line with torches and clipboards. They are looking for things most passengers never notice: a worn rail joint, a loose bolt on an overhead wire bracket, a drainage grate packed with autumn leaves.\n\nThe line opened in 1912 and has run almost continuously since, apart from a pause during a flood in the 1950s. Keeping a century-old system running is less about dramatic repairs than about thousands of small ones, done before anyone has a chance to complain.\n\n\"The best night is a boring night,\" said Helena Marsh, who has led the overnight inspection team for nine years. \"If we find nothing, it means the day crews did their job and the trams will run on time.\"\n\nThe team works in pairs. One person checks the track while the other watches for traffic, since several stretches of the line share the road with cars and delivery vans even at that hour. Each fault is photographed, tagged with a location and sorted by urgency before the first tram leaves the depot at half past five.\n\nMost of what they find is minor. A typical night produces a dozen notes, of which perhaps one needs attention before morning. But the records add up. Over the past decade, the inspection logs have shown engineers which curves wear fastest and which junctions flood in heavy rain, and that has shaped where the city spends its maintenance budget.\n\nThe work is not glamorous, and recruiting for it is hard. Night shifts are unpopular, and the skills involved take years to learn. The transit authority has started pairing new staff with retiring inspectors for a full year before they lead a shift on their own.\n\nFor Marsh, the appeal is the quiet. \"You see the city with nobody in it,\" she said. \"Then at five o'clock the bakeries open, the first tram goes past, and you know you were part of why it's running.\""}]}</script>
