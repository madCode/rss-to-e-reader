name: Python- Type checking and Testing

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: re-check when a PR's base changes
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # diff-cover compares against the base branch
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run mypy
        run: mypy .
      - name: Run unittests with coverage
        run: python -m coverage run --source=base_classes,default_modules,custom_modules -m unittest discover -s tests -p "*_test.py"
      - name: Coverage report
        run: python -m coverage report --show-missing
      - name: Coverage of changed lines (at least 90%)
        run: |
          python -m coverage xml
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref || 'main' }} --fail-under=90
